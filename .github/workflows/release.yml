name: Release

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: release
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: release_gate
        ports:
          - 5432/tcp
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U release -d release_gate"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - name: Install reviewed packaging tools and backend
        run: |
          python -m pip install --index-url https://pypi.org/simple -r backend/requirements-packaging.txt
          python -m pip install --index-url https://pypi.org/simple -r backend/requirements-dev.txt ruff==0.17.1
          python -m pip check
          python -m pip freeze > "${RUNNER_TEMP}/backend-freeze.txt"
      - name: Provision approved model bytes
        env:
          LEGACY_MODEL_BASE64: ${{ secrets.LEGACY_MODEL_BASE64 }}
        run: python scripts/ci/provision_models.py
      - name: Targeted lint and release-control regressions
        run: |
          python -m ruff check backend/app scripts/ci --select F,E9
          python -m ruff check backend/tests/api/test_d1_authorization_postgres.py backend/tests/auth_context.py --select F,E9
          python -m pytest -q scripts/ci/test_release_controls.py
          git diff --check
      - name: All backend tests, seven PostgreSQL suites, real models and migrations
        working-directory: backend
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          RUN_MODEL_INTEGRATION: '1'
          RELEASE_DISPOSABLE_POSTGRES: '1'
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          JWT_SECRET_KEY: disposable-ci-test-signing-key-32-characters
          APP_ENV: test
        run: |
          url="postgresql+psycopg://release:disposable-ci-only@127.0.0.1:${PG_PORT}/release_gate"
          export MODEL_TEST_DATABASE_URL="$url" DUAL_STAGE_TEST_DATABASE_URL="$url"
          export STAGED_IMPORT_TEST_DATABASE_URL="$url" USER_MANAGEMENT_TEST_DATABASE_URL="$url"
          export FRESHNESS_TEST_DATABASE_URL="$url" C1_CASEWORK_TEST_DATABASE_URL="$url"
          export D1_AUDIT_TEST_DATABASE_URL="$url"
          python ../scripts/ci/release_backend.py
      - name: Retain safe verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-release-evidence
          path: |
            ${{ runner.temp }}/release-evidence/backend-summary.json
            ${{ runner.temp }}/backend-freeze.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove private model bytes
        if: always()
        run: rm -f backend/app/ml/artifacts/dropout-risk-v1/model.joblib

  frontend:
    name: Frontend release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Clean install, audit, typecheck and production build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm audit --audit-level=low
          npm run typecheck
          npm run build

  docker:
    name: Docker release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - name: Provision approved model bytes
        env:
          LEGACY_MODEL_BASE64: ${{ secrets.LEGACY_MODEL_BASE64 }}
        run: python scripts/ci/provision_models.py
      - name: Build isolated images and HTTP smoke
        run: python scripts/ci/docker_smoke.py --project "release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --evidence "${RUNNER_TEMP}/docker-smoke.json"
      - name: Retain safe smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-release-evidence
          path: ${{ runner.temp }}/docker-smoke.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove private model bytes
        if: always()
        run: rm -f backend/app/ml/artifacts/dropout-risk-v1/model.joblib

  release:
    name: Release required
    if: always()
    needs: [backend, frontend, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER: ${{ needs.docker.result }}
        run: test "$BACKEND" = success && test "$FRONTEND" = success && test "$DOCKER" = success
